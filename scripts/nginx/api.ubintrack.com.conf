##
## api.ubintrack.com — Ubintrack API (Django + Gunicorn)
## Copiar en el servidor: /etc/nginx/sites-available/api.ubintrack.com.conf
## sudo ln -sf /etc/nginx/sites-available/api.ubintrack.com.conf /etc/nginx/sites-enabled/
##

server {
    listen 80;
    server_name api.ubintrack.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name api.ubintrack.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/git/backend/static/;
    }

    location /media/ {
        alias /home/git/backend/media/;
    }
}
