# LOCAL only — Postgres for developer machines.
# DEV/PRODUCTION use native Postgres; do not run this compose on those hosts.
#
# `name` evita compartir el proyecto Compose "backend" con PortPax y Publivalla
# (si no, `docker-compose up` en esta carpeta recrea los otros contenedores).
#
# Host ports (familia BCT):
#   5432 = ubintrack, 5433 = portpax, 5434 = publivalla
# (POSTGRES_PORT in backend/.env; default below is 5432).
#
# Usage (from backend/):
#   docker-compose up -d
#   docker-compose down
#   docker-compose logs -f postgres
#   # or: docker compose … if the Compose V2 plugin is installed

name: ubintrack

services:
  postgres:
    image: postgres:16-alpine
    container_name: ubintrack-postgres-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ubintrack}
      POSTGRES_USER: ${POSTGRES_USER:-ubintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ubintrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ubintrack_pgdata:
    name: ubintrack_pgdata
